name: ci

# Checks that run without Orca. The worker/indexer suites need `orca plugin test`
# (Orca's runtime and `orca/testing`), so they run locally via scripts/release-check.mjs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo and listing checks
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/check-repo.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-repo.mjs
          fi
      - name: Panel tests
        shell: bash
        run: node --test panel/model.test.mjs panel/views/views.test.mjs
